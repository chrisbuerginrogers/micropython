<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Find The Letter</title>

<!-- mini-coi: cross-origin isolation via a service worker, so Pyodide's
     stack-switching (what legoeducation needs to make Bluetooth calls look
     synchronous) works even from a plain static file server. -->
<script src="./mini-coi-fd.js" scope="./"></script>

<link rel="stylesheet" href="./header.css">

<link rel="stylesheet" href="https://pyscript.net/releases/2026.3.1/core.css">
<script type="module" src="https://pyscript.net/releases/2026.3.1/core.js"></script>

<!-- crossorigin is required here: this CDN sends Access-Control-Allow-Origin
     but no Cross-Origin-Resource-Policy header, and the page's cross-origin
     isolation (COEP: require-corp, from mini-coi above) blocks a cross-origin
     script load unless it's fetched in CORS mode. -->
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js" crossorigin="anonymous"></script>

<style>
 :root { color-scheme: light; }
 body{font-family:-apple-system,system-ui,sans-serif;margin:0;padding:24px;
   background:#ffffff;color:#1a1d24;max-width:1150px;margin-inline:auto}
 h1{font-weight:500;font-size:20px;margin:0 0 4px}
 .sub{color:#5f6368;font-size:13px;margin-bottom:18px}
 .card{background:#ffffff;border:1px solid #e1e4e8;border-radius:14px;
   padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.05);margin-bottom:20px}
 .status{font-size:12px;display:inline-block;padding:2px 8px;border-radius:6px}
 .status-off{background:#eceff1;color:#5f6368}
 .status-on{background:#e3f6ea;color:#1e8e3e}
 .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
 button{font-size:13px;font-weight:500;padding:8px 14px;border:0;
   border-radius:9px;background:#3b6fd6;color:#fff;cursor:pointer;
   display:inline-flex;align-items:center;gap:6px}
 button:disabled{background:#eceff1;color:#9aa0a6;cursor:not-allowed}
 button.btn-outline{background:transparent;border:1px solid #c9ccd1;color:#1a1d24}
 button.btn-active{background:#279c58}
 .btn-icon{width:16px;height:16px;flex:none}

 /* vehicle controls (left, 1/4) and plot (right, 3/4), side by side */
 .row-50{display:grid;grid-template-columns:1fr 1fr;gap:24px}
 .two-col{display:grid;grid-template-columns:1fr 3fr;gap:24px;align-items:start}
 @media (max-width:640px){.row-50, .two-col{grid-template-columns:1fr}}

 /* the two driving pictures, motor above clock */
 .picker-stack{display:flex;flex-direction:column;align-items:center;gap:14px;margin:20px 0}
 .picture-wrap{position:relative;display:flex;flex-direction:column;align-items:center}
 .picture-btn{width:140px;padding:18px 10px;border:1px solid #e1e4e8;
   border-radius:16px;background:#f7f8fa;display:flex;flex-direction:column;
   align-items:center;gap:8px;color:#1a1d24}
 .picture-btn:hover{background:#eef0f3;border-color:#c9ccd1}
 .picture-btn svg{color:#3b6fd6;width:64px;height:64px}
 .picture-label{font-size:15px;font-weight:600}
 .picture-hint{font-size:11px;color:#9aa0a6}

 .popover{position:absolute;top:calc(100% + 8px);left:50%;
   transform:translateX(-50%);background:#fff;border:1px solid #e1e4e8;
   border-radius:12px;box-shadow:0 6px 18px rgba(0,0,0,.12);padding:10px;
   display:flex;flex-wrap:wrap;gap:6px;width:180px;z-index:10}
 .popover.hidden{display:none}
 .chip{background:#f7f8fa;color:#1a1d24;border:1px solid #e1e4e8;
   border-radius:8px;padding:6px 0;width:50px;font-size:13px;font-weight:500}
 .chip:hover{background:#eef0f3}
 #custom-duration{width:100%;margin-top:4px;padding:7px 9px;font-size:13px;
   border:1px solid #c9ccd1;border-radius:8px;box-sizing:border-box}
 #custom-duration.hidden{display:none}

 .run-row{display:flex;justify-content:center;margin-bottom:24px}
 #btn-run{width:72px;height:72px;border-radius:50%;background:#279c58;
   font-size:26px;padding:0;line-height:1}
 #btn-run:disabled{background:#eceff1;color:#c9ccd1}
 #btn-run.running{background:#9a6b00}

 .plot-label{font-size:13px;color:#5f6368;display:flex;align-items:center;gap:6px}
 .small-input{width:64px;padding:6px 8px;font-size:13px;
   border:1px solid #c9ccd1;border-radius:7px;box-sizing:border-box}
 /* plain text input -- deliberately not type=number, so there's no native
    up/down spinner */
 .speed-row{margin-top:10px}
 #color-plot{width:100%;height:340px;margin-top:14px}

 .switch-row{display:flex;align-items:center;gap:10px;font-size:13px;
   color:#9aa0a6;cursor:pointer;user-select:none}
 .switch-row span.active{color:#1a1d24;font-weight:600}
 #mode-track{width:42px;height:24px;background:#c9ccd1;border-radius:12px;
   position:relative;transition:background .15s;flex:none}
 #mode-track.on{background:#3b6fd6}
 #mode-track .switch-thumb{position:absolute;top:2px;left:2px;width:20px;
   height:20px;border-radius:50%;background:#fff;transition:transform .15s;
   box-shadow:0 1px 3px rgba(0,0,0,.25)}
 #mode-track.on .switch-thumb{transform:translateX(18px)}

 #log{background:#f7f8fa;border:1px solid #e1e4e8;border-radius:12px;
   padding:10px 12px;height:140px;overflow-y:auto;font-family:ui-monospace,Menlo,monospace;
   font-size:12px;line-height:1.6}
 .log-ok{color:#1e8e3e}
 .log-warn{color:#9a6b00}
 .log-err{color:#c0392b}
 .log-info{color:#5f6368}
</style>
</head>
<body>

<div id="browser-warning" class="browser-warning hidden"></div>
<script>
(function () {
  var warn = document.getElementById('browser-warning');
  if (!('bluetooth' in navigator)) {
    var ua = navigator.userAgent;
    var looksChrome = /Chrome/.test(ua) && !/Edg\//.test(ua) && !/OPR\//.test(ua);
    warn.textContent = looksChrome
      ? "⚠ Web Bluetooth isn't available in this browser, even though it looks like Chrome. These pages need desktop Chrome (Edge and Opera also work) with Web Bluetooth enabled."
      : "⚠ This browser doesn't support Web Bluetooth. Open this page in Chrome (Edge and Opera also work) — Safari and Firefox can't run it.";
    warn.classList.remove('hidden');
  }
})();
</script>

<h1>Find The Letter</h1>
<div class="sub">Drive the Double Motor across a shape while plotting the Color Sensor's live raw-color trace.</div>

<div class="row-50">

  <div class="card">
    <div class="row">
      <div id="doublemotor-status" class="status status-off">not connected</div>
      <button id="btn-connect-doublemotor">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="5" cy="17" r="3"/><circle cx="19" cy="17" r="3"/>
          <line x1="8" y1="17" x2="16" y2="17"/>
          <rect x="7" y="6" width="10" height="7" rx="1.5"/>
          <line x1="12" y1="13" x2="12" y2="17"/>
        </svg>
        Connect Double Motor
      </button>
      <button id="btn-disconnect-doublemotor" class="btn-outline" disabled>Disconnect</button>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <div id="colorsensor-status" class="status status-off">not connected</div>
      <button id="btn-connect-colorsensor">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.5"/>
          <line x1="12" y1="1" x2="12" y2="3.5"/>
          <line x1="12" y1="20.5" x2="12" y2="23"/>
          <line x1="1" y1="12" x2="3.5" y2="12"/>
          <line x1="20.5" y1="12" x2="23" y2="12"/>
        </svg>
        Connect Color Sensor
      </button>
      <button id="btn-disconnect-colorsensor" class="btn-outline" disabled>Disconnect</button>
    </div>
  </div>

</div>

<div class="two-col">

  <div class="col">
    <div class="picker-stack">

      <div class="picture-wrap">
        <button id="motor-picture" class="picture-btn" type="button">
          <svg viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="34" fill="none" stroke="currentColor" stroke-width="4"/>
            <text id="motor-arrow" x="50" y="51" text-anchor="middle" dominant-baseline="central"
                  font-size="42" fill="currentColor">↻</text>
          </svg>
          <div id="direction-label" class="picture-label">Forward</div>
          <div class="picture-hint">click to flip direction</div>
        </button>

        <!-- outside the button on purpose: an input nested inside it would
             also toggle direction on every click into the field, since
             clicks bubble up through the button. -->
        <label class="plot-label speed-row" for="speed-input">Speed
          <input id="speed-input" class="small-input" type="text" inputmode="numeric" value="100">
        </label>
      </div>

      <div class="picture-wrap">
        <button id="clock-picture" class="picture-btn" type="button">
          <svg viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="34" fill="none" stroke="currentColor" stroke-width="4"/>
            <line x1="50" y1="50" x2="50" y2="28" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
            <line x1="50" y1="50" x2="66" y2="58" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
            <circle cx="50" cy="50" r="4" fill="currentColor"/>
          </svg>
          <div id="duration-label" class="picture-label">1s</div>
          <div class="picture-hint">click to choose duration</div>
        </button>

        <div id="duration-popover" class="popover hidden">
          <button class="chip" data-value="1">1s</button>
          <button class="chip" data-value="2">2s</button>
          <button class="chip" data-value="3">3s</button>
          <button class="chip" data-value="4">4s</button>
          <button class="chip" data-value="5">5s</button>
          <button class="chip" data-value="custom">?</button>
          <input id="custom-duration" class="hidden" type="text" inputmode="decimal"
                 placeholder="seconds, e.g. 2.5">
        </div>
      </div>

    </div>

    <div class="run-row">
      <button id="btn-run" disabled title="Drive">▶</button>
    </div>
  </div>

  <div class="col">
    <div class="card">
      <div class="row">
        <label class="plot-label" for="sample-interval">Sample every
          <input id="sample-interval" class="small-input" type="text" inputmode="decimal" value="200"> ms
        </label>
        <button id="btn-plot-run" disabled>Run</button>
        <div id="mode-switch-row" class="switch-row">
          <span id="mode-label-rgb" class="active">RGB</span>
          <span id="mode-track"><span class="switch-thumb"></span></span>
          <span id="mode-label-reflection">Reflected Light</span>
        </div>
      </div>
      <div id="color-plot"></div>
    </div>
  </div>

</div>

<div id="log"></div>

<script type="py" src="./find_the_letter.py" config="./pyscript.json"></script>

</body>
</html>
